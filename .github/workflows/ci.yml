name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / C++17
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Configure (CMake)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      # Defensive pass: raw g++ build exactly like a student machine.
      - name: Raw build (no CMake)
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          $CXX -std=c++17 -Wall -Wextra -Werror mainApp.cpp \
               manager_system/*.cpp -o car_rental_raw
          ./build/unit_tests >/dev/null && echo "tests green"
