name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / C++17 / ubuntu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v7

      - name: Configure (CMake)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      # Defensive pass: raw g++ build exactly like a student machine.
      - name: Raw build (no CMake)
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          $CXX -std=c++17 -Wall -Wextra -Werror mainApp.cpp \
               manager_system/*.cpp -o car_rental_raw
          ./build/unit_tests >/dev/null && echo "tests green"

      # The binary answers its own CLI contract on every push.
      - name: CLI contract (--help / --version / --no-color / unknown)
        run: |
          ./build/car_rental --version | grep -q "Car Rental Management System"
          ./build/car_rental --help | grep -q -- "--no-color"
          NO_COLOR=1 ./build/car_rental -v | grep -q "zero dependencies"
          if ./build/car_rental --bogus 2>/dev/null; then
            echo "unknown option must fail"; exit 1
          fi

      # v3.4.0: the guided demo plays a whole shift unattended — this
      # also locks the demo script to the menus (any drift fails here).
      - name: Guided demo (--demo) plays a full shift
        run: |
          NO_COLOR=1 ./build/car_rental --demo | tee /tmp/demo.log > /dev/null
          grep -q "GUIDED DEMO" /tmp/demo.log
          grep -q "RE-QUOTED" /tmp/demo.log
          grep -q "LOYALTY CARD" /tmp/demo.log
          grep -q "INCOME REPORT" /tmp/demo.log
          grep -q "MONTHLY REPORT" /tmp/demo.log
          grep -q "Goodbye" /tmp/demo.log

      # v3.7.0: the read-only REST layer answers real sockets.
      - name: REST smoke (--serve answers /health, /cars, /monthly)
        run: |
          ./build/car_rental --serve 8199 >/tmp/rest.log 2>&1 &
          sleep 1
          curl -fsS http://127.0.0.1:8199/health | grep -q '"ok"'
          curl -fsS http://127.0.0.1:8199/cars | grep -q '"count"'
          curl -fsS "http://127.0.0.1:8199/monthly?year=2026&month=11" | grep -q '"month"'
          kill %1

  # The README promises Linux | macOS | Windows — prove all three.
  cross-platform:
    name: ${{ matrix.os }} / CMake + ctest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Configure (CMake, default toolchain)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      # --config/-C pair keeps multi-config generators (Windows' Visual
      # Studio) building and testing the same configuration; they are
      # no-ops on single-config Linux/macOS.
      - name: Build
        run: cmake --build build --config Release -j

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure -C Release

  # The README promises leak-free code — prove it on every push.
  sanitizers:
    name: AddressSanitizer + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build with sanitizers
        run: |
          g++ -std=c++17 -g -Wall -Wextra -fsanitize=address,undefined \
              tests/test_main.cpp manager_system/*.cpp -o unit_tests_asan

      - name: Run suite under sanitizers
        run: ./unit_tests_asan

  # The browser demo ships the compiled binary; every push re-proves
  # that the same sources still compile to WebAssembly and serve a
  # scripted session end to end.
  wasm:
    name: WebAssembly build (Emscripten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74

      - name: Build the browser demo binary
        run: make wasm

      - name: Smoke-test the compiled app in Node
        run: make wasm-test

  # House style is applied with `make format` (clang-format 23); this
  # job only reports drift so PRs stay tidy.
  format:
    name: clang-format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: clang-format (no changes expected)
        run: |
          pip install clang-format==23.1.5
          clang-format --dry-run -Werror \
              mainApp.cpp manager_system/*.cpp basic_structures/*.h \
              tests/*.cpp

  # The version declared in CHANGELOG.md (release notes) must match the
  # project() version, CITATION.cff and the --version output of the app.
  versions:
    name: Version declarations agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: check_versions.sh
        run: bash scripts/check_versions.sh

  # Unit-test coverage with gcovr on a Debug + --coverage build; publishes
  # a Cobertura XML artifact and prints the per-file summary into the job
  # page. Same recipe as `make coverage`. Coverage covers the manager_system
  # modules + headers; mainApp.cpp is the interactive main() and is proven
  # by the CLI-contract job instead.
  coverage:
    name: Unit-test coverage (gcovr)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure coverage build
        run: >
          cmake -B build-cov -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS=--coverage -DCMAKE_EXE_LINKER_FLAGS=--coverage

      - name: Build
        run: cmake --build build-cov -j

      - name: Run the test suite
        run: ctest --test-dir build-cov --output-on-failure

      - name: Coverage report (gcovr)
        run: |
          pip install gcovr
          # suspicious_hits.warn: gcov can emit bogus hit counters for inline
          # functions compiled under --coverage (observed on SHA256.cpp rotr);
          # without this flag gcovr aborts the whole report (exit 64).
          gcovr -r . --filter manager_system/ \
                --gcov-ignore-parse-errors suspicious_hits.warn \
                --xml build-cov/coverage.xml --txt build-cov/coverage.txt
          echo "## Coverage — gcovr (manager_system modules)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat build-cov/coverage.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build-cov/coverage.xml
            build-cov/coverage.txt
