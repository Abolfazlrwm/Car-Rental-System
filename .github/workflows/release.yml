name: Release assets

# On every version tag: build native binaries for every platform the
# README promises plus the browser (WebAssembly) bundle, and attach
# them all to the GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  native:
    name: ${{ matrix.os }} binary
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: car_rental-linux-x64.tar.gz
          - os: macos-latest
            asset: car_rental-macos-arm64.tar.gz
          - os: windows-latest
            asset: car_rental-windows-x64.zip

    steps:
      - uses: actions/checkout@v7

      - name: Configure (CMake)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      # --config Release matters on Windows, where the default Visual
      # Studio generator is multi-config and builds Debug by default.
      - name: Build
        run: cmake --build build --config Release -j

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          tar czf "${{ matrix.asset }}" -C build car_rental

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/Release/car_rental.exe -DestinationPath "${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  cross:
    name: cross builds (Android ARM64 static + macOS Intel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # zig ships musl libc + libc++ for every target, so one pinned
      # toolchain cross-compiles both assets with no SDK downloads.
      - name: Install zig 0.13.0
        run: |
          curl -sL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o /tmp/zig.tar.xz
          mkdir -p /tmp/zig && tar xJf /tmp/zig.tar.xz -C /tmp/zig --strip-components=1
          echo "/tmp/zig" >> "$GITHUB_PATH"

      - name: Android / Termux — static ARM64
        run: |
          zig c++ -target aarch64-linux-musl -O2 -std=c++17 -s \
            mainApp.cpp manager_system/*.cpp -o car_rental
          file car_rental | grep -q "ARM aarch64"
          file car_rental | grep -q "statically linked"

      - name: Smoke-test the ARM64 binary under qemu
        run: |
          # Package name moved between runner images; try both, and if
          # neither installs, ship the asset anyway (the static build is
          # already verified by file(1) above) with a CI warning.
          sudo apt-get update -qq
          for pkg in qemu-user-static qemu-user; do
            sudo apt-get install -y -qq "$pkg" && break
          done
          QEMU=$(command -v qemu-aarch64-static || command -v qemu-aarch64 || true)
          if [ -z "$QEMU" ]; then
            echo "::warning::qemu unavailable on this runner — runtime smoke skipped"
            exit 0
          fi
          "$QEMU" ./car_rental --version | grep -q "Car Rental Management System"
          printf '3\n' | "$QEMU" ./car_rental > /dev/null # seed fleet -> Exit

      - name: Package (Android)
        run: |
          cp README.md README-Termux.txt
          tar czf car_rental-android-arm64.tar.gz car_rental README-Termux.txt

      # The same static ARM64 binary also serves plain ARM64 Linux
      # (servers, Raspberry Pi-class boards) — packaged without the
      # Termux note.
      - name: Package (Linux ARM64)
        run: |
          mkdir -p arm64 && cp car_rental arm64/car_rental
          tar czf car_rental-linux-arm64.tar.gz -C arm64 car_rental

      - name: macOS Intel — Mach-O x86_64
        run: |
          zig c++ -target x86_64-macos -O2 -std=c++17 -s \
            mainApp.cpp manager_system/*.cpp -o car_rental
          file car_rental | grep -q "Mach-O 64-bit x86_64"
          tar czf car_rental-macos-x64.tar.gz car_rental

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cross-assets
          path: |
            car_rental-android-arm64.tar.gz
            car_rental-linux-arm64.tar.gz
            car_rental-macos-x64.tar.gz

  wasm:
    name: browser bundle (WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74

      - name: Build the browser demo
        run: make wasm

      - name: Bundle
        run: |
          cd docs-site
          # One level up lands in the workspace root, where the
          # upload step looks for the file.
          zip -r ../car_rental-wasm-demo.zip demo.html demo/car_rental.js demo/car_rental.wasm demo/pre.js demo/vendor

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: car_rental-wasm-demo.zip
          path: car_rental-wasm-demo.zip

  publish:
    name: Attach assets to the release
    needs: [native, cross, wasm]
    runs-on: ubuntu-latest
    steps:
      - name: Download all built assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach to the tagged release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
