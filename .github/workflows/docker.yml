name: Docker (GHCR)

# Every push to main ships :latest and every release tag ships its own
# version tag (amd64 + arm64) to ghcr.io — the README's
# `docker run -it ghcr.io/abolfazlrwm/car-rental-system` one-liner.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: build & push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # arm64 builds run through QEMU emulation.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Compute the lowercase image name (GHCR requires it)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build & push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The shipped image answers its own contract before we call it done.
      - name: Smoke — the image answers --version
        run: |
          docker run --rm --platform linux/amd64 \
            "${{ steps.img.outputs.name }}:sha-${GITHUB_SHA::7}" --version
